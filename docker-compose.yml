version: "3.8"

networks:
  petsaude-net:
    driver: bridge

services:
  # Banco de Dados
  postgres:
    image: postgres:16-alpine
    container_name: petsaude-postgres
    # wal_level=logical é OBRIGATÓRIO para o Debezium criar o slot de
    # replicação lógica. Antes isso era feito com "ALTER SYSTEM SET" dentro
    # do script de init (001_init.sql) — mas ALTER SYSTEM só grava o
    # postgresql.auto.conf, não reinicia o Postgres, e como o script de
    # init roda no primeiro boot (antes de qualquer restart), o Postgres
    # nunca chegava a subir com wal_level=logical de fato. Por isso o
    # connector do Debezium falhava sempre. Usar `command` resolve isso,
    # porque o Postgres já sobe com a flag certa desde o primeiro start.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: petsaude
      POSTGRES_PASSWORD: petsaude
      POSTGRES_DB: petsaude
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petsaude"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - petsaude-net

  # Cache
  redis:
    image: redis:7-alpine
    container_name: petsaude-redis
    ports:
      - "5555:6379"
    networks:
      - petsaude-net

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.15.2
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - petsaude-net

  # Kafka + Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - petsaude-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - petsaude-net

  # Debezium Connect (CDC)
  debezium:
    image: debezium/connect:2.5
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - petsaude-net

  debezium-connector-init:
    image: curlimages/curl:8.10.1
    container_name: petsaude-debezium-connector-init
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./backend/debezium/register-connector.sh:/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/register-connector.sh"]
    networks:
      - petsaude-net
    restart: "no"

  # frontend:
  #   build: ./frontend
  #   container_name: frontend
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:8000
  #   networks:
  #     - petsaude-net
  # Descomente para rodar via Docker; em desenvolvimento prefira `npm run dev`
  # na pasta frontend/, apontando para o Kong em http://localhost:8000.

  # API Gateway
  kong:
    image: kong:3.8.0
    container_name: petsaude-kong
    depends_on:
      - indicators-service
      - import-service
      - search-service
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./backend/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    networks:
      - petsaude-net

  # ── Microsserviços do domínio PET-Saúde Clima ─────────────────────

  # Lê indicadores (epidemiológicos, climáticos, vulnerabilidade, alertas,
  # municípios, GATs) com cache-aside no Redis. Alimenta os gráficos do
  # dashboard.
  indicators-service:
    build: ./backend/indicators-service
    container_name: indicators-service
    ports:
      - "3001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_USER: petsaude
      DB_PASS: petsaude
      DB_NAME: petsaude
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 5555
      PORT: 8080
    networks:
      - petsaude-net

  # Recebe upload de planilhas (.csv/.xlsx), valida e grava em staging;
  # no commit, grava nas tabelas reais dentro de uma sessão de importação.
  import-service:
    build: ./backend/import-service
    container_name: import-service
    ports:
      - "3003:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: petsaude
      DB_PASS: petsaude
      DB_NAME: petsaude
      DB_PORT: 5432
      PORT: 8081
    networks:
      - petsaude-net

  search-service:
    build: ./backend/search-service
    container_name: search-service
    ports:
      - "3002:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    networks:
      - petsaude-net

  # Consome o CDC do Postgres (via Debezium/Kafka), reindexa no
  # Elasticsearch e invalida em tempo real o cache Redis do
  # indicators-service — é isso que faz o dashboard atualizar sozinho
  # assim que uma planilha é commitada pelo import-service.
  cdc-worker:
    build: ./backend/cdc-worker
    container_name: cdc-worker
    depends_on:
      - kafka
      - elasticsearch
      - redis
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPICS: "dbserver.public.indicadores_epidemiologicos,dbserver.public.indicadores_climaticos,dbserver.public.indices_vulnerabilidade,dbserver.public.alertas"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_ADDR: redis:5555
    networks:
      - petsaude-net

volumes:
  pg_data:
  es_data:
